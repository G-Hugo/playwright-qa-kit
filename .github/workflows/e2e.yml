name: E2E Playwright

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1-5' # tous les jours ouvrés à 8 h Paris (6 h UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://www.saucedemo.com' }}
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      # Remontée des échecs en tickets : définir ISSUE_TRACKER=jira ou linear dans les variables du dépôt
      ISSUE_TRACKER: ${{ vars.ISSUE_TRACKER }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
      LINEAR_LABEL_IDS: ${{ vars.LINEAR_LABEL_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run typecheck
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Publication du rapport HTML sur GitHub Pages. Désactivée par défaut : la variable de dépôt
      # PUBLISH_REPORT=true l'active (Settings → Secrets and variables → Actions → Variables).
      # Ne l'activer que sur un dépôt dont le rapport peut être public.
      # !cancelled() et non always() : un run annulé ne doit pas déployer une page sans rapport.
      - name: Assembler la page publique
        if: ${{ !cancelled() && vars.PUBLISH_REPORT == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p public/report
          [ -d playwright-report ] && cp -r playwright-report/. public/report/
          [ -d site ] && cp -r site/. public/
          [ -f site/build.js ] && node site/build.js public
          [ -f examples/saucedemo/rapport-fin-mission.pdf ] && cp examples/saucedemo/rapport-fin-mission.pdf public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && vars.PUBLISH_REPORT == 'true' && github.ref == 'refs/heads/main' }}
        with:
          path: public

  pages:
    needs: e2e
    if: ${{ !cancelled() && vars.PUBLISH_REPORT == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
